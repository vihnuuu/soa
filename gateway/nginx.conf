
events {}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream catalog_backend {
        zone catalog_backend 64k;
        server catalog-service:8001 resolve;
    }

    upstream lending_backend {
        zone lending_backend 64k;
        server lending-service:8002 resolve;
    }

    server {
        listen 80;

        location /api/catalog/ {
            proxy_pass http://catalog_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/lending/ {
            proxy_pass http://lending_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
