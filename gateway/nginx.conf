events {}

http {
    server_tokens off;

    log_format json_combined escape=json
        '{"timestamp":"$time_iso8601","service":"gateway","level":"INFO","message":"http_request",'
        '"request_id":"$request_id","remote_addr":"$remote_addr","method":"$request_method",'
        '"path":"$uri","status":$status,"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time","bytes_sent":$body_bytes_sent}';
    access_log /dev/stdout json_combined;

    limit_req_zone  $binary_remote_addr zone=api_rl:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
    map $request_method $loans_write_key {
        default "";
        POST    $binary_remote_addr;
    }
    limit_req_zone  $loans_write_key zone=loans_write_rl:10m rate=2r/s;
    limit_req_status  429;
    limit_conn_status 429;

    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream catalog_backend {
        zone catalog_backend 64k;
        server catalog-service:8001 resolve;
    }

    upstream lending_backend {
        zone lending_backend 64k;
        server lending-service:8002 resolve;
    }

    server {
        listen 80;

        client_max_body_size 64k;
        client_body_timeout  10s;

        add_header X-Request-ID $request_id always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;

        location /api/catalog/ {
            limit_req  zone=api_rl burst=20 nodelay;
            limit_conn conn_per_ip 20;
            proxy_pass http://catalog_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/lending/ {
            limit_req  zone=api_rl burst=20 nodelay;
            limit_req  zone=loans_write_rl burst=5 nodelay;
            limit_conn conn_per_ip 20;
            proxy_pass http://lending_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 8081;
        access_log off;
        location /stub_status {
            stub_status;
        }
    }
}
