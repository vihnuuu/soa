route:
  receiver: n8n-incident-response
  group_by: [alertname, service]
  group_wait: 5s
  group_interval: 30s
  repeat_interval: 30m

receivers:
  - name: n8n-incident-response
    webhook_configs:
      - url: http://n8n:5678/webhook/incident-alert
        send_resolved: true
        max_alerts: 0

inhibit_rules:
  - source_matchers: [alertname="NodeDown"]
    target_matchers: [severity=~"warning|critical", alertname!="NodeDown"]
    equal: [service]
