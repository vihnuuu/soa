global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    stack: soa-library

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: lending-service
    static_configs:
      - targets: ["lending-service:8002"]
        labels: { role: coordinator }

  - job_name: catalog-service
    static_configs:
      - targets: ["catalog-service:8001"]
        labels: { role: shard }

  - job_name: notification-service
    static_configs:
      - targets: ["notification-service:9102"]
        labels: { role: shard }

  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: rabbitmq-queues
    metrics_path: /metrics/detailed
    params:
      family: [queue_coarse_metrics, queue_consumer_count]
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: gateway
    static_configs:
      - targets: ["nginx-exporter:9113"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
