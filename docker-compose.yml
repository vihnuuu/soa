services:
  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - library_net

  catalog-service:
    build: ./catalog-service
    restart: unless-stopped
    networks:
      - library_net

  lending-service:
    build: ./lending-service
    restart: unless-stopped
    environment:
      CATALOG_SERVICE_URL: http://catalog-service:8001
      RABBIT_HOST: rabbitmq
    depends_on:
      catalog-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - library_net

  notification-service:
    build: ./notification-service
    restart: unless-stopped
    environment:
      RABBIT_HOST: rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - library_net

  gateway:
    image: nginx:1.28-alpine
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - lending-service
      - catalog-service
    networks:
      - library_net

networks:
  library_net:
    driver: bridge